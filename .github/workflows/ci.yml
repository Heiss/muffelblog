name: CI

on:
  # Pull Requests gegen jeden Branch, damit auch gestapelte PRs geprüft werden.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Erkennt, ob Code betroffen ist. Reine Änderungen an okf/ oder an Markdown-
  # Dateien im Wurzelverzeichnis lösen die schweren Prüfungen nicht aus.
  changes:
    name: Änderungen erkennen
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              okf/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$base" "$HEAD_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, Typen, Unit-Tests, Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E-Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muffelblog/site exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e

  docker:
    name: Docker-Build der Seite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target site-dist --output type=local,dest=out .
      - name: Ergebnis prüfen
        run: test -s out/index.html

  contract:
    name: Contract-Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      memos:
        image: neosmemo/memos:26.11.0
        ports:
          - 5230:5230
    env:
      MEMOS_CONTRACT_URL: http://localhost:5230
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  # Pflicht-Check für main. Läuft immer, damit GitHub den Merge nicht wegen
  # eines nie gemeldeten Checks blockiert, und entscheidet selbst, ob
  # übersprungene Jobs in Ordnung sind.
  gate:
    name: CI Gate
    needs: [changes, check, e2e, docker, contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis auswerten
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER: ${{ needs.docker.result }}
          CONTRACT: ${{ needs.contract.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "Änderungserkennung fehlgeschlagen: $CHANGES"
            exit 1
          fi
          if [ "$CODE" = "true" ]; then
            for result in "$CHECK" "$E2E" "$DOCKER" "$CONTRACT"; do
              if [ "$result" != "success" ]; then
                echo "Ein Pflicht-Job ist nicht erfolgreich: $result"
                exit 1
              fi
            done
          else
            echo "Nur Dokumentation geändert, schwere Prüfungen entfallen."
          fi
