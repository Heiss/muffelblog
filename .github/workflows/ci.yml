name: CI

on:
  # Pull requests against any branch, so stacked PRs are checked as well.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detects whether code is affected. Changes only to okf/ or to Markdown files
  # in the root directory do not trigger the heavy checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              okf/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$base" "$HEAD_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, types, unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muffelblog/site exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e

  docker:
    name: Docker build of the site
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target site-dist --output type=local,dest=out .
      - name: Check the result
        run: test -s out/index.html

  compose:
    name: Compose stack
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker/init-env.sh
      - run: docker compose up --detach --build
      - name: Smoke test
        run: docker/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes

  contract:
    name: Contract tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      memos:
        image: neosmemo/memos:26.11.0
        ports:
          - 5230:5230
    env:
      MEMOS_CONTRACT_URL: http://localhost:5230
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  # Required check for main. Always runs, so GitHub does not block the merge
  # because of a check that was never reported, and decides itself whether
  # skipped jobs are fine.
  gate:
    name: CI Gate
    needs: [changes, check, e2e, docker, compose, contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the result
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER: ${{ needs.docker.result }}
          COMPOSE: ${{ needs.compose.result }}
          CONTRACT: ${{ needs.contract.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "Change detection failed: $CHANGES"
            exit 1
          fi
          if [ "$CODE" = "true" ]; then
            for result in "$CHECK" "$E2E" "$DOCKER" "$COMPOSE" "$CONTRACT"; do
              if [ "$result" != "success" ]; then
                echo "A required job was not successful: $result"
                exit 1
              fi
            done
          else
            echo "Only documentation changed, the heavy checks are skipped."
          fi
