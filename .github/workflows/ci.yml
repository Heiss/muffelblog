name: CI

on:
  # Pull requests against any branch, so stacked PRs are checked as well.
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the whole suite again before it builds images.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detects whether code is affected. Changes only to okf/ or to Markdown files
  # in the root directory do not trigger the heavy checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              okf/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$base" "$HEAD_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, types, unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Build the documentation site
        run: pnpm --filter @muffelblog/docs build

  e2e:
    name: E2E tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muffelblog/site exec playwright install --with-deps chromium
      - run: pnpm build
      # German build for the small language suite (e2e/language-de.spec.ts)
      - run: pnpm build:de
      - run: pnpm test:e2e

  docker:
    name: Docker build of the site
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target site-dist --output type=local,dest=out .
      - name: Check the result
        run: test -s out/index.html

  compose:
    name: Compose stack
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The demo: sample content, Mailpit, COMPOSE_FILE with compose.demo.yaml.
      - run: docker/init-env.sh --demo
      - name: Short check interval for the comment flow
        run: |
          echo 'MUFFEL_CHECK_INTERVAL_SECONDS=10' >> .env
          echo 'MUFFEL_DEBOUNCE_CHECKS=1' >> .env
          # Sending is on in this job: the first start must send nothing.
          echo 'MUFFEL_WEBMENTIONS_SEND=1' >> .env
      - name: The production setups are valid, and a missing value is named
        env:
          REMARK_SECRET: secret-1234567890
          REMARK_ADMIN_PASSWD: passwd-1234567890
          SITE_URL: https://blog.example.org
          COMMENTS_URL: https://comments.example.org
          MAIL_FROM: blog@example.org
          REMARK_ADMIN_EMAIL: admin@example.org
          SMTP_HOST: smtp.example.org
          SMTP_PORT: '465'
        run: |
          docker compose --env-file /dev/null -f compose.yaml config -q
          MUFFEL_RELEASES_DIR=/srv/muffelblog/releases \
            docker compose --env-file /dev/null -f compose.yaml -f compose.host-folder.yaml config -q
          if env -u SITE_URL docker compose --env-file /dev/null -f compose.yaml config -q 2> missing.txt; then
            echo 'compose.yaml must require SITE_URL'; exit 1
          fi
          grep SITE_URL missing.txt
      - run: docker compose up --detach --build
      - name: rclone is in the builder image
        run: docker compose run --rm --no-deps --entrypoint rclone builder version
      - name: The builder does not run as root and can write its folders
        run: |
          test "$(docker compose exec -T builder id -u)" = 1000
          docker compose exec -T builder sh -c 'touch /data/state/.w /data/releases/.w /data/cache/.w && rm /data/state/.w /data/releases/.w /data/cache/.w'
      - name: HEIC photos can be converted in the builder image
        run: docker compose exec -T builder node src/heic-check.ts
      - name: Smoke test
        run: docker/smoke.sh
      - name: A comment reaches the page through the scheduler
        run: docker/comment-flow.sh
      - name: Moderation, backup and restore of comments
        run: docker/moderation-flow.sh
      - name: Webmentions are on, the first start sends nothing
        run: docker/webmention-flow.sh
      - name: A received webmention becomes a comment and goes again when deleted
        run: docker/webmention-receive-flow.sh
      - name: The builder reports its status
        run: |
          docker compose exec -T builder cat /data/state/status.json | tee /dev/stderr | grep -q '"state": "ok"'
      - name: Logs (short, so the failure above stays visible)
        if: failure()
        run: |
          echo '--- builder status'; docker compose exec -T builder cat /data/state/status.json || true
          docker compose logs --no-color --tail 40 builder remark42 mailpit web webmention-io
      - run: docker compose down --volumes

  # The supported versions (supported-versions.json) for the contract matrix.
  versions:
    name: Supported versions
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.read.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "json=$(jq -c . supported-versions.json)" >> "$GITHUB_OUTPUT"

  contract:
    name: Contract tests (${{ matrix.line }} versions)
    needs: [changes, versions]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        line: [current, previous]
    services:
      memos:
        image: neosmemo/memos:${{ fromJSON(needs.versions.outputs.json).memos[matrix.line] }}
        ports:
          - 5230:5230
      nextcloud:
        image: nextcloud:${{ fromJSON(needs.versions.outputs.json).nextcloud[matrix.line] }}
        ports:
          - 8081:80
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: contract-admin-password-1234
          NEXTCLOUD_TRUSTED_DOMAINS: localhost localhost:8081
      remark42:
        image: umputun/remark42:v1.18.0
        ports:
          - 8082:8080
        # Remark42 refuses to start without a place for its data.
        volumes:
          - remark42-contract:/srv/var
        env:
          REMARK_URL: http://localhost:8082
          SITE: contract
          SECRET: contract-secret-1234567890
          ADMIN_PASSWD: contract-admin-passwd-1234
    env:
      MEMOS_CONTRACT_URL: http://localhost:5230
      REMARK42_CONTRACT_URL: http://localhost:8082
      REMARK42_CONTRACT_ADMIN_PASSWD: contract-admin-passwd-1234
      NEXTCLOUD_CONTRACT_URL: http://localhost:8081
      NEXTCLOUD_CONTRACT_PASSWORD: contract-admin-password-1234
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install rclone (pinned)
        run: |
          curl -fsSLO https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.deb
          sudo dpkg -i rclone-v1.75.2-linux-amd64.deb
          rclone version
      - run: pnpm test:contract

  # Required check for main. Always runs, so GitHub does not block the merge
  # because of a check that was never reported, and decides itself whether
  # skipped jobs are fine.
  # Mutation tests (W18): incremental on pull requests and on main (the result
  # of the last run is restored from the cache), complete on a release tag and
  # every night (mutation.yml).
  # A mutation score below 80 % fails the job (stryker.config.json).
  mutation:
    name: Mutation tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Result of the last run
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.ref }}-
            stryker-refs/heads/main-
      - name: Incremental run
        if: github.ref_type != 'tag'
        run: pnpm test:mutation
      - name: Complete run (release tag)
        if: github.ref_type == 'tag'
        run: pnpm test:mutation --force

  gate:
    name: CI Gate
    needs: [changes, versions, check, e2e, docker, compose, contract, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the result
        env:
          CHANGES: ${{ needs.changes.result }}
          VERSIONS: ${{ needs.versions.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER: ${{ needs.docker.result }}
          COMPOSE: ${{ needs.compose.result }}
          CONTRACT: ${{ needs.contract.result }}
          MUTATION: ${{ needs.mutation.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "Change detection failed: $CHANGES"
            exit 1
          fi
          if [ "$CODE" = "true" ]; then
            for result in "$VERSIONS" "$CHECK" "$E2E" "$DOCKER" "$COMPOSE" "$CONTRACT" "$MUTATION"; do
              if [ "$result" != "success" ]; then
                echo "A required job was not successful: $result"
                exit 1
              fi
            done
          else
            echo "Only documentation changed, the heavy checks are skipped."
          fi
