# Production with OUR Caddy and a domain: HTTPS certificates come automatically.
#
#   docker compose -f compose.yaml -f compose.domain.yaml up -d
#
# Needs DNS records for both names pointing at this machine, and open ports
# 80 and 443. Set in .env: SITE_ADDRESS=blog.example.org,
# COMMENTS_ADDRESS=comments.example.org, SITE_URL=https://blog.example.org,
# COMMENTS_URL=https://comments.example.org and the SMTP_* variables.
# Combine with compose.production.yaml only if you also want the bind mount.

services:
  web:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the host name of the blog}
      COMMENTS_ADDRESS: ${COMMENTS_ADDRESS:?set COMMENTS_ADDRESS to the host name of the comments}
    # Replaces the local ports of compose.yaml.
    ports: !override
      - '80:80'
      - '443:443'
      - '443:443/udp'

  remark42:
    environment:
      AUTH_EMAIL_FROM: ${MAIL_FROM:?set MAIL_FROM, the sender of the login mails}
      ADMIN_SHARED_EMAIL: ${REMARK_ADMIN_EMAIL:?set REMARK_ADMIN_EMAIL, the address of the comment administrator}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST, the mail server of the login mails}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      SMTP_TLS: ${SMTP_TLS:-true}

  mailpit:
    profiles: [mail-sink]
