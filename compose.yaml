# Muffelblog: static blog, built by the builder, served by Caddy.
#
#   docker/init-env.sh     creates .env with random secrets; fill in the rest
#   docker compose up -d   starts the blog
#
# This file is the production setup behind YOUR reverse proxy. Our Caddy serves
# plain HTTP on 127.0.0.1: the blog on port 8080, the comments on port 8081.
# Your proxy adds HTTPS and forwards the two host names to these ports.
# Settings come from `.env`, see `.env.example` and the docs:
# https://heiss.github.io/muffelblog/start/getting-started/
#
# Local demo with sample content and a mail sink: `docker/init-env.sh --demo`
# (it sets COMPOSE_FILE=compose.yaml:compose.demo.yaml in .env).
# Your proxy serves the files itself: compose.host-folder.yaml.

name: muffelblog

services:
  builder:
    image: ghcr.io/heiss/muffelblog-builder:${MUFFEL_VERSION:-latest}
    build:
      context: .
      target: builder
    # Checks Nextcloud and Memos every MUFFEL_CHECK_INTERVAL_SECONDS and builds on a change.
    restart: unless-stopped
    healthcheck:
      # Healthy as soon as a release is online.
      test: ['CMD', 'test', '-s', '/data/releases/current/build.json']
      interval: 5s
      timeout: 3s
      retries: 120
    environment:
      # Sample content instead of real sources (the demo sets it to `demo`).
      MUFFEL_FIXTURES: ${MUFFEL_FIXTURES:-}
      SITE_URL: ${SITE_URL:?set SITE_URL in .env, the public address of the blog}
      # The sources: the builder stops at its start with a message if they are missing.
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_SHARE_TOKEN: ${NEXTCLOUD_SHARE_TOKEN:-}
      NEXTCLOUD_SHARE_PASSWORD: ${NEXTCLOUD_SHARE_PASSWORD:-}
      MEMOS_URL: ${MEMOS_URL:-}
      COMMENTS_URL: ${COMMENTS_URL:?set COMMENTS_URL in .env, the public address of the comments}
      # How the builder reaches Remark42 inside the network (static copy of the comments).
      REMARK_INTERNAL_URL: http://remark42:8080
      # Language of the user interface: en (default) or de. One language per build.
      MUFFEL_LANG: ${MUFFEL_LANG:-}
      MUFFEL_FEED_PAGE_SIZE: ${MUFFEL_FEED_PAGE_SIZE:-}
      MUFFEL_FEED_EXCERPT_CHARS: ${MUFFEL_FEED_EXCERPT_CHARS:-}
      MUFFEL_RSS_ITEMS: ${MUFFEL_RSS_ITEMS:-}
      MUFFEL_RELEASES_KEPT: ${MUFFEL_RELEASES_KEPT:-}
      MUFFEL_CHECK_INTERVAL_SECONDS: ${MUFFEL_CHECK_INTERVAL_SECONDS:-}
      MUFFEL_DEBOUNCE_CHECKS: ${MUFFEL_DEBOUNCE_CHECKS:-}
      # Outgoing webmentions: off by default (needs SITE_URL when on). See docs, reference/configuration.
      MUFFEL_WEBMENTIONS_SEND: ${MUFFEL_WEBMENTIONS_SEND:-}
      MUFFEL_WEBMENTIONS_BLOCK: ${MUFFEL_WEBMENTIONS_BLOCK:-}
      MUFFEL_WEBMENTIONS_ALLOW_PRIVATE: ${MUFFEL_WEBMENTIONS_ALLOW_PRIVATE:-}
      MUFFEL_WEBMENTIONS_TIMEOUT_MS: ${MUFFEL_WEBMENTIONS_TIMEOUT_MS:-}
      MUFFEL_WEBMENTIONS_MAX_KB: ${MUFFEL_WEBMENTIONS_MAX_KB:-}
      MUFFEL_WEBMENTIONS_MAX_TARGETS: ${MUFFEL_WEBMENTIONS_MAX_TARGETS:-}
      MUFFEL_WEBMENTIONS_DELAY_MS: ${MUFFEL_WEBMENTIONS_DELAY_MS:-}
      MUFFEL_WEBMENTIONS_ATTEMPTS: ${MUFFEL_WEBMENTIONS_ATTEMPTS:-}
      MUFFEL_WEBMENTIONS_NO_ENDPOINT_DAYS: ${MUFFEL_WEBMENTIONS_NO_ENDPOINT_DAYS:-}
      MUFFEL_WEBMENTIONS_ENDPOINT_DAYS: ${MUFFEL_WEBMENTIONS_ENDPOINT_DAYS:-}
      MUFFEL_ALERT_WEBHOOK: ${MUFFEL_ALERT_WEBHOOK:-}
      MUFFEL_ALERT_FORMAT: ${MUFFEL_ALERT_FORMAT:-}
      # Receiving webmentions through webmention.io: off by default. Needs the
      # token of webmention.io and the administrator login of Remark42 (the
      # mentions become comments of the administrator). See the docs.
      MUFFEL_WEBMENTIONS_RECEIVE: ${MUFFEL_WEBMENTIONS_RECEIVE:-}
      WEBMENTION_ENDPOINT: ${WEBMENTION_ENDPOINT:-}
      WEBMENTION_IO_URL: ${WEBMENTION_IO_URL:-}
      WEBMENTION_IO_TOKEN: ${WEBMENTION_IO_TOKEN:-}
      REMARK_ADMIN_PASSWD: ${REMARK_ADMIN_PASSWD}
      # Profiles of the owner as rel=me links (login at webmention.io).
      MUFFEL_REL_ME: ${MUFFEL_REL_ME:-}
      # Statistics with your own Matomo (optional, without cookies).
      MATOMO_URL: ${MATOMO_URL:-}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
    depends_on:
      - remark42
    volumes:
      - releases:/data/releases
      - cache:/data/cache
      - state:/data/state

  web:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_healthy
    environment:
      COMMENTS_URL: ${COMMENTS_URL}
      # Your Matomo, named in the Content Security Policy (empty: none).
      MATOMO_URL: ${MATOMO_URL:-}
      # Senders whose X-Forwarded-For is believed: your reverse proxy.
      MUFFEL_WEB_LISTEN_PORT: ${MUFFEL_WEB_LISTEN_PORT:-80}
      MUFFEL_COMMENTS_LISTEN_PORT: ${MUFFEL_COMMENTS_LISTEN_PORT:-8081}
      MUFFEL_TRUSTED_PROXIES: ${MUFFEL_TRUSTED_PROXIES:-private_ranges}
    ports:
      # Your reverse proxy forwards to these. Inside only by default (127.0.0.1);
      # set MUFFEL_BIND to an address of this host if your proxy runs elsewhere.
      - '${MUFFEL_BIND:-127.0.0.1}:${MUFFEL_PORT:-8080}:${MUFFEL_WEB_LISTEN_PORT:-80}'
      - '${MUFFEL_BIND:-127.0.0.1}:${MUFFEL_COMMENTS_PORT:-8081}:${MUFFEL_COMMENTS_LISTEN_PORT:-8081}'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - releases:/srv/releases:ro
      - caddy-data:/data
    healthcheck:
      # Answered by a port that only exists inside the container (docker/Caddyfile).
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:2020/healthz',
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  remark42:
    image: umputun/remark42:v1.18.0
    restart: unless-stopped
    environment:
      REMARK_URL: ${COMMENTS_URL}
      SITE: muffelblog
      # The blog may embed the widget (frame-ancestors).
      ALLOWED_HOSTS: "'self',${SITE_URL}"
      SECRET: ${REMARK_SECRET:?set REMARK_SECRET in .env, see .env.example}
      ADMIN_PASSWD: ${REMARK_ADMIN_PASSWD:?set REMARK_ADMIN_PASSWD in .env, see .env.example}
      # Behind our Caddy the peer is a Docker address.
      # Forwarding headers are believed only from there, so nobody can choose
      # their own address to get around the rate limit.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.16.0.0/12}
      # Notifications go to this email. UI privileges require the login's user ID.
      ADMIN_SHARED_EMAIL: ${REMARK_ADMIN_EMAIL:?set REMARK_ADMIN_EMAIL in .env, the address of the comment administrator}
      ADMIN_SHARED_ID: ${REMARK_ADMIN_ID:-}
      # Every new comment is mailed to the administrator.
      NOTIFY_ADMINS: email
      NOTIFY_EMAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env, the sender of the login mails}
      AUTH_EMAIL_ENABLE: 'true'
      AUTH_EMAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env, the mail server of the login mails}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - remark42-var:/srv/var

volumes:
  releases:
  cache:
  state:
  caddy-data:
  remark42-var:
