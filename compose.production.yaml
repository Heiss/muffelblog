# Production with YOUR OWN reverse proxy (nginx, Caddy, Traefik, ...).
#
#   docker compose -f compose.yaml -f compose.production.yaml up -d
#
# What changes compared to compose.yaml:
#  * No web server of ours: your proxy serves the folder `current` of the
#    releases directory (a bind mount on the host, shared with your proxy).
#  * Remark42 listens on 127.0.0.1 only, your proxy forwards the comments host to it.
#  * No Mailpit: login mails go through your SMTP server (SMTP_* required).
# Examples for the proxy: https://heiss.github.io/muffelblog/ (Production setup)

services:
  builder:
    volumes:
      # Same container path as in compose.yaml, so this entry replaces the volume.
      - ${MUFFEL_RELEASES_DIR:?set MUFFEL_RELEASES_DIR to a folder on the host, for example /srv/muffelblog/releases}:/data/releases

  web:
    # Not started. `--profile own-caddy` brings it back.
    profiles: [own-caddy]

  remark42:
    ports:
      - '127.0.0.1:${REMARK_PORT:-8082}:8080'
    environment:
      AUTH_EMAIL_FROM: ${MAIL_FROM:?set MAIL_FROM, the sender of the login mails}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST, the mail server of the login mails}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      SMTP_TLS: ${SMTP_TLS:-true}

  mailpit:
    # Not started in production.
    profiles: [mail-sink]
